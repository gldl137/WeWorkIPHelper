<div class="fade-in max-w-7xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold gradient-text">应用ID管理</h1>
        <p class="text-base-content/60 mt-1">管理需要同步IP的企业微信应用</p>
    </div>
    
    <!-- 添加应用表单 -->
    <div class="card bg-base-200 border border-base-content/20 mb-8">
        <div class="card-body">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </div>
                <div>
                    <h2 class="card-title text-lg">添加应用</h2>
                    <p class="text-sm text-base-content/60">输入企业微信应用ID</p>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="label">
                        <span class="label-text font-medium">应用名称 *</span>
                    </label>
                    <div class="relative">
                        <input id="app-name-input" type="text" class="input w-full pl-10 bg-base-200/50 focus:bg-base-100 transition-colors border border-base-content/20 focus:border-base-content/40" placeholder="例如: 内部通讯" data-testid="app-name-input" />
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                        </svg>
                    </div>
                </div>

                <div>
                    <label class="label">
                        <span class="label-text font-medium">应用ID *</span>
                        <span class="label-text-alt text-info cursor-pointer hover:underline" onclick="showAppIdHelp()">如何获取?</span>
                    </label>
                    <div class="relative">
                        <input id="app-id-input" type="text" class="input w-full pl-10 bg-base-200/50 focus:bg-base-100 transition-colors border border-base-content/20 focus:border-base-content/40" placeholder="例如: 5629501477633217" data-testid="app-id-input" />
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" />
                        </svg>
                    </div>
                    <div class="text-xs text-base-content/60 mt-2">
                        浏览器地址栏中的应用ID，不是AgentId
                    </div>
                </div>

                <div>
                    <label class="label">
                        <span class="label-text font-medium">备注</span>
                    </label>
                    <div class="relative">
                        <input id="app-remark-input" type="text" class="input w-full pl-10 bg-base-200/50 focus:bg-base-100 transition-colors border border-base-content/20 focus:border-base-content/40" placeholder="例如: 用于内部系统通知" data-testid="app-remark-input" />
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="card-actions justify-end mt-4">
                <button class="btn btn-success shadow-lg shadow-success/20 hover:shadow-success/40" onclick="addApp()" data-testid="add-app-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    添加应用
                </button>
            </div>
        </div>
    </div>
    
    <!-- 应用列表 -->
    <div class="card bg-base-200 border border-base-content/20">
        <div class="card-body">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-secondary/10 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                </div>
                <div>
                    <h2 class="card-title text-lg">已配置的应用</h2>
                    <p class="text-sm text-base-content/60">当前系统管理的企业微信应用</p>
                </div>
            </div>
            
            <div class="overflow-x-auto rounded-xl bg-base-200/30">
                <table class="table w-full">
                    <colgroup>
                        <col style="width: 20%;">
                        <col style="width: 20%;">
                        <col style="width: 20%;">
                        <col style="width: 20%;">
                        <col style="width: 20%;">
                    </colgroup>
                    <thead>
                        <tr class="border-b border-base-content/10">
                            <th class="text-base-content/70 font-semibold text-center">可信IP更新</th>
                            <th class="text-base-content/70 font-semibold">应用名称</th>
                            <th class="text-base-content/70 font-semibold">应用ID</th>
                            <th class="text-base-content/70 font-semibold">备注</th>
                            <th class="text-base-content/70 font-semibold text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="apps-table">
                        <tr>
                            <td colspan="5" class="text-center py-12">
                                <div class="flex flex-col items-center">
                                    <span class="loading loading-spinner loading-lg text-primary"></span>
                                    <p class="mt-4 text-base-content/50">加载应用列表...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
