<div class="fade-in max-w-7xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold gradient-text">登录凭证管理</h1>
        <p class="text-base-content/60 mt-1">管理企业微信登录状态和Cookie，支持智能扫码和手动配置</p>
    </div>
    
    <!-- 登录方式选择 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        
        
        <!-- 高级管理 -->
        <div class="card bg-base-200 border border-base-content/20 lg:col-span-2 hover:border-warning/30 transition-all duration-300">
            <div class="card-body">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-warning/10 to-warning/5 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-warning" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="card-title text-lg text-warning">高级管理</h2>
                        <p class="text-sm text-base-content/60">手动添加和查看数据库中的Cookie</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Cookie配置 -->
                    <div class="space-y-4">
                        <div>
                            <label class="label">
                                <span class="label-text font-medium">Cookie配置</span>
                                <span class="label-text-alt text-xs text-base-content/50">手动输入Cookie</span>
                            </label>
                            <div class="text-xs text-base-content/60 mb-2" style="min-height: 16px;">
                                📋 访问 <a href="https://work.weixin.qq.com" target="_blank" class="link link-primary">企业微信官网</a> → 登录后按F12 → Application → Cookies → 复制所有内容粘贴至此
                            </div>
                            <div class="w-full p-3 bg-base-300/50 rounded-lg border border-base-content/20 focus-within:border-base-content/40 transition-all duration-200" style="height: 137px;">
                                <textarea id="cookie-input" class="w-full h-full bg-transparent border-0 outline-none resize-none font-mono text-sm" placeholder="在此粘贴Cookie值，格式：key=value; key2=value2..." style="overflow-y: auto;" data-testid="cookie-input"></textarea>
                            </div>
                        </div>
                        
                        <div class="flex gap-2">
                            <button class="btn btn-success flex-1 btn-sm shadow-lg shadow-success/20 hover:shadow-success/40 transition-all duration-200" onclick="saveCookies()" data-testid="save-cookie-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                                </svg>
                                保存
                            </button>
                            
                            <button class="btn btn-info flex-1 btn-sm shadow-lg shadow-info/20 hover:shadow-info/40 transition-all duration-200" onclick="testCookie()" data-testid="test-cookie-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                测试
                            </button>
                        </div>
                    </div>
                    
                    <!-- 数据库Cookie管理 -->
                    <div class="space-y-4">
                        <div>
                            <label class="label">
                                <span class="label-text font-medium">数据库Cookie</span>
                                <span class="label-text-alt text-xs text-base-content/50">已保存的Cookie</span>
                            </label>
                            <div id="cookie-time-display" class="text-xs text-base-content/60 mb-2" style="min-height: 16px;">
                                <!-- Cookie保存时间将在这里显示 -->
                            </div>
                            <div class="w-full p-3 bg-base-300/50 rounded-lg border border-base-content/20 transition-all duration-200" style="height: 137px;">
                                <div id="saved-cookie-display" class="w-full h-full text-sm font-mono text-base-content/70">
                                    <div class="flex items-center justify-center h-full">
                                        <span class="loading loading-spinner loading-sm mr-2"></span>
                                        加载中...
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex gap-2">
                            <button class="btn btn-warning flex-1 btn-sm shadow-lg shadow-warning/20 hover:shadow-warning/40 transition-all duration-200" onclick="refreshSavedCookie()" data-testid="refresh-cookie-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                                刷新
                            </button>
                            
                            <button class="btn btn-error flex-1 btn-sm shadow-lg shadow-error/20 hover:shadow-error/40 transition-all duration-200" onclick="deleteSavedCookie()" data-testid="delete-cookie-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                                删除
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
